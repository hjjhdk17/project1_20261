[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma2wazuh"
version = "0.7.0"
description = "Academic Sigma-to-Wazuh converter prototype (Phase 7: batch reporting)"
readme = "README.md"
requires-python = ">=3.11,<4"
# Same direct pins as requirements.txt (method C). Keep both files in sync.
dependencies = [
    "pysigma==2.0.2",
    "PyYAML==6.0.3",
    "pytest==8.4.2",
]

[project.scripts]
sigma2wazuh = "sigma2wazuh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full Sigma corpus; not part of the default suite",
]
